<!DOCTYPE html>
<html>
  <head>
    <title>Test Formulario Instalación</title>
  </head>
  <body>
    <h2>Test Simple del Formulario</h2>

    <form
      method="POST"
      action="/install"
      onsubmit="console.log('Enviando a:', this.action);"
    >
      <input type="hidden" name="_token" value="{{ csrf_token() }}" />

      <h3>Base de Datos</h3>
      <input
        type="text"
        name="database[host]"
        value="127.0.0.1"
        placeholder="Host"
      />
      <input
        type="text"
        name="database[username]"
        value="root"
        placeholder="Usuario"
      />
      <input
        type="password"
        name="database[password]"
        value="root"
        placeholder="Contraseña"
      />
      <input
        type="text"
        name="database[database]"
        value="wabot"
        placeholder="Base de datos"
      />

      <h3>Administrador</h3>
      <input
        type="text"
        name="admin[username]"
        value="admin"
        placeholder="Usuario admin"
      />
      <input
        type="email"
        name="admin[email]"
        value="admin@test.com"
        placeholder="Email admin"
      />
      <input
        type="password"
        name="admin[password]"
        value="password123"
        placeholder="Contraseña admin"
      />

      <br /><br />
      <button type="submit">Instalar</button>
    </form>

    <script>
      // Interceptar el submit para ver qué pasa
      document.querySelector("form").addEventListener("submit", function (e) {
        console.log("Form submit intercepted");
        console.log("Action:", this.action);
        console.log("Method:", this.method);
        console.log("FormData:", new FormData(this));

        // Permitir que continúe
        return true;
      });
    </script>
  </body>
</html>
